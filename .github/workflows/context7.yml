name: Context7

# Re-index the docs on Context7 (the "Ask the docs" chat) when they change on
# main. Needs the CONTEXT7_API_KEY repository secret; without it the job skips.
on:
  push:
    branches: [main]
    paths: [docs/**, README.md, context7.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: context7
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the Context7 index
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::notice::CONTEXT7_API_KEY is not set; skipping the refresh."
            exit 0
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CONTEXT7_API_KEY" \
            -d '{"libraryName": "/nsquaredlab/myogestic"}')
          cat response.txt; echo
          case "$code" in
            2*) ;;
            429) echo "::notice::Context7's daily refresh limit is reached; its automatic cycle picks up the change." ;;
            *) echo "::error::Context7 refresh failed with HTTP $code"; exit 1 ;;
          esac
