; liblsl settings for this project. Read from the current working directory, so it
; applies when MyoGestic is run from the repo root and nowhere else — your machine-wide
; ~/lsl_api/lsl_api.cfg is untouched. Point $LSLAPICFG at this file to apply it from
; another directory.
;
; Why IPv6 is off here
; -------------------
; liblsl binds a multicast responder per group per interface address, and retries on
; every resolve. On a typical macOS laptop that is 13 IPv6 addresses against 3 with IPv4
; — including awdl0 (AirDrop) and llw0 (low-latency WLAN), which are IPv6-only and both
; live on the Wi-Fi chip. Every one of those binds failed with "Can't assign requested
; address" in every session we captured, several times a second, forever.
;
; That traffic goes at the transmit path of Apple's Wi-Fi driver extension, which on this
; hardware (MacBookPro18,3, macOS 26.6) deadlocks on its own work-loop lock:
; IOUserNetworkEthernet::_TxSQDataAvailable_Impl -> requestDequeue, aborted by
; IO80211DeadlockPolice. When it goes, configd wedges on IPConfigurationAgentQueue and
; the machine follows — twice as a forced restart, once as a kernel panic, once as a hang
; that needed the power button, over two days.
;
; This does not fix that; the lock inversion is Apple's. It removes the largest avoidable
; share of what provokes it. IPv4 discovery is untouched, so a second machine on the LAN
; — an amplifier, another MyoGestic — still resolves normally.
[ports]
IPv6 = disable
