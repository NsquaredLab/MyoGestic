<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 340" role="img" aria-labelledby="mg-vhi-title mg-vhi-desc"
     xmlns="http://www.w3.org/2000/svg"
     preserveAspectRatio="xMidYMid meet">
  <title id="mg-vhi-title">MyoGestic ↔ VHI controls, recording sessions and pose read-backs</title>
  <desc id="mg-vhi-desc">
    Two lanes. MyoGestic (Python) on the left contains the App, Pipeline,
    ControlLink, RemoteTarget, RemoteClient and RecordingClient.
    Virtual Hand Interface on the right contains the Predicted hand and
    the Control hand. ControlLink passes continuous values through RemoteTarget's
    one LSL outlet per continuous DOF, each named after the address it carries. The Predicted
    hand subscribes to the vhi.prediction.* ones. RemoteTarget queues discrete
    SetControl commands through RemoteClient for the Control hand.
    Publishing the vhi.control.pose.* streams drives the Control hand
    continuously instead. RemoteClient queries GetControlManifest for control
    capabilities. RecordingClient synchronously calls SetRecordingSession to gate
    recording and GetRecordingSessionState to read session state and the current
    movement. VHI returns the hands' poses to the App via the nine-channel
    VHI_Control and VHI_Predict LSL outlets.
  </desc>
  <defs>
    <style>
      .text-strong { fill: #475569; font-weight: 600; }
      .text-body   { fill: #64748b; font-weight: 500; }
      .text-faint  { fill: #64748b; font-weight: 400; }
      @media (prefers-color-scheme: dark) {
        .text-strong { fill: #e2e8f0; }
        .text-body   { fill: #cbd5e1; }
        .text-faint  { fill: #94a3b8; }
      }
      .lane      { fill: rgba(113,151,175,0.08); stroke: #7197AF; stroke-width: 1.5; }
      .node      { fill: rgba(113,151,175,0.18); stroke: #7197AF; stroke-width: 1.5; }
      .accent    { fill: rgba(113,151,175,0.30); stroke: #7197AF; stroke-width: 1.5; }
      .edge        { stroke: #7197AF; stroke-width: 2.5; fill: none; }
      .edge-thin   { stroke: #7197AF; stroke-width: 2; fill: none; opacity: 0.85; }
      .edge-dash   { stroke: #7197AF; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; opacity: 0.75; }
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <marker id="mgv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7197AF"/>
    </marker>
    <marker id="mgv-arrow-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7197AF" opacity="0.75"/>
    </marker>
  </defs>

  <!-- MyoGestic lane -->
  <rect class="lane" x="10" y="30" width="300" height="280" rx="12"/>
  <text class="text-faint" x="30" y="56" font-size="13" letter-spacing="0.02em">MyoGestic (Python)</text>
  <rect class="accent" x="30" y="68" width="260" height="40" rx="8"/>
  <text class="text-strong" x="160" y="93" font-size="14" text-anchor="middle">App · Pipeline · ControlLink</text>
  <path class="edge-thin" d="M160 108 L160 126" marker-end="url(#mgv-arrow)"/>
  <rect class="node" x="30" y="126" width="260" height="42" rx="8"/>
  <text class="text-strong" x="160" y="145" font-size="14" text-anchor="middle">RemoteTarget(...)</text>
  <text class="text-faint"  x="160" y="160" font-size="11" text-anchor="middle">one LSL outlet per continuous DOF</text>
  <path class="edge-thin" d="M160 168 L160 188" marker-end="url(#mgv-arrow)"/>
  <rect class="node" x="30" y="188" width="260" height="50" rx="8"/>
  <text class="text-strong" x="160" y="209" font-size="14" text-anchor="middle">RemoteClient</text>
  <text class="text-faint"  x="160" y="226" font-size="11" text-anchor="middle">queued commands · capability query</text>
  <rect class="node" x="30" y="254" width="260" height="42" rx="8"/>
  <text class="text-strong" x="160" y="273" font-size="14" text-anchor="middle">RecordingClient</text>
  <text class="text-faint"  x="160" y="288" font-size="11" text-anchor="middle">session gate + state · synchronous gRPC</text>

  <!-- VHI lane -->
  <rect class="lane" x="570" y="30" width="300" height="280" rx="12"/>
  <text class="text-faint" x="590" y="56" font-size="13" letter-spacing="0.02em">Virtual Hand Interface (Godot)</text>
  <rect class="node" x="590" y="68" width="260" height="40" rx="8"/>
  <text class="text-strong" x="720" y="85" font-size="13" text-anchor="middle">VHI_Control · VHI_Predict</text>
  <text class="text-faint"  x="720" y="101" font-size="11" text-anchor="middle">nine-channel pose read-backs · LSL</text>
  <rect class="node" x="590" y="126" width="260" height="42" rx="8"/>
  <text class="text-strong" x="720" y="145" font-size="14" text-anchor="middle">Predicted hand</text>
  <text class="text-faint"  x="720" y="160" font-size="11" text-anchor="middle">renders continuous controls</text>
  <rect class="node" x="590" y="188" width="260" height="50" rx="8"/>
  <text class="text-strong" x="720" y="209" font-size="14" text-anchor="middle">Control hand</text>
  <text class="text-faint"  x="720" y="226" font-size="11" text-anchor="middle">named movements / continuous pose</text>
  <rect class="node" x="590" y="254" width="260" height="42" rx="8"/>
  <text class="text-strong" x="720" y="273" font-size="13" text-anchor="middle">Recording session</text>
  <text class="text-faint"  x="720" y="288" font-size="11" text-anchor="middle">input gate · session + movement state</text>

  <!-- Data plane: outlet → Predicted hand -->
  <path class="edge" d="M290 147 L590 147" marker-end="url(#mgv-arrow)"/>
  <text class="text-body"  x="440" y="137" font-size="13" text-anchor="middle">vhi.prediction.* · LSL</text>

  <!-- Control plane: gRPC client → Control hand -->
  <path class="edge" d="M290 201 L590 201" marker-end="url(#mgv-arrow)"/>
  <text class="text-body"  x="440" y="195" font-size="13" text-anchor="middle">SetControl · discrete gRPC</text>
  <!-- The manifest describes the whole target, not only the Control hand. -->
  <path class="edge-dash" d="M570 232 L290 232" marker-end="url(#mgv-arrow-faint)"/>
  <text class="text-body" x="440" y="225" font-size="12" text-anchor="middle">GetControlManifest · capabilities</text>

  <!-- Optional STREAM mode: control_outlet -> Control hand (dashed) -->
  <path class="edge-dash" d="M290 158 C 350 176, 510 176, 590 188" marker-end="url(#mgv-arrow-faint)"/>
  <text class="text-faint" x="440" y="167" font-size="11" text-anchor="middle">vhi.control.pose.* · optional LSL</text>

  <!-- Recording session: synchronous calls, separate from RemoteClient -->
  <path class="edge" d="M290 265 L590 265" marker-end="url(#mgv-arrow)"/>
  <text class="text-body" x="440" y="258" font-size="12" text-anchor="middle">SetRecordingSession</text>
  <path class="edge-dash" d="M590 292 L290 292" marker-end="url(#mgv-arrow-faint)"/>
  <text class="text-body" x="440" y="285" font-size="12" text-anchor="middle">GetRecordingSessionState</text>

  <!-- Return: VHI pose read-backs → App (dashed) -->
  <path class="edge-dash" d="M590 90 L290 90" marker-end="url(#mgv-arrow-faint)"/>
  <text class="text-body" x="440" y="81" font-size="13" text-anchor="middle">pose read-backs · LSL</text>

  <!-- Footer pointer text -->
  <text class="text-faint" x="440" y="328" font-size="11" text-anchor="middle">
    Continuous LSL drives poses; discrete gRPC selects movements; recording RPCs gate sessions and query state.
  </text>
</svg>
