# Map your model's outputs to VHI's controls.
#   left  = your name, anything you like
#   right = a control VHI declares (it owns the kind, range and states)
# See what a running VHI exports:  uv run --extra grpc python tools/inspect_canonical_control.py
# Full reference: docs/api/controls.md

[dofs]

# The OPERATOR's hand (vhi.control.pose.*), not the model's
# (vhi.prediction.*). Separate stream, so use
#   VhiTarget(vhi.control_outlet(), client=client, stream="control_pose")
# and declare it:  client.declare(controls, control_pose="canonical")
setup_thumb = "vhi.control.pose.thumb"
setup_index = "vhi.control.pose.index"

# One output closing the operator's hand.
setup_close = [
  { target = "vhi.control.pose.middle", weight = 1.0 },
  { target = "vhi.control.pose.ring" },
  { target = "vhi.control.pose.little" },
]
