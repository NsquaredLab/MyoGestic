# Map your model's outputs to VHI's controls.
#   left  = your name, anything you like
#   right = a control VHI declares (it owns the kind, range and states)
# See what a running VHI exports:  uv run --extra grpc python tools/inspect_canonical_control.py
# Full reference: docs/api/controls.md

[dofs]

# One output, fanned out to every finger.
fist = [
  "vhi.prediction.thumb",
  "vhi.prediction.thumb.abduction",
  "vhi.prediction.index",
  "vhi.prediction.middle",
  "vhi.prediction.ring",
  "vhi.prediction.little",
]

# The other kind. VHI declares this address discrete, so it takes a named state, not a
# number — the right shape for a genuine event (a preset, a keypress), and the wrong one
# for a joint. `debounce_s` is yours: how long a state must hold before it counts.
gesture = { target = "vhi.control.gesture", debounce_s = 0.1 }
