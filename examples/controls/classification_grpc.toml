# Map your model's outputs to VHI's controls.
#   left  = your name, anything you like
#   right = a control VHI declares (it owns the kind, range and states)
# See what a running VHI exports:  uv run --extra grpc python tools/inspect_control.py
# Full reference: docs/api/controls.md

[dofs]
# A fist is not six flexions. The thumb comes *across* the fingers as it curls, and
# across is adduction — the opposite of what the abduction DOF's name denotes — so it
# rides along at -1. At +1 it splayed the thumb away from the palm on every fist.
fist = { targets = [
  { target = "vhi.prediction.thumb.flexion" },
  { target = "vhi.prediction.thumb.abduction", weight = -1.0 },
  { target = "vhi.prediction.index" },
  { target = "vhi.prediction.middle" },
  { target = "vhi.prediction.ring" },
  { target = "vhi.prediction.little" },
] }
gesture = { target = "vhi.control.gesture", debounce_s = 0.1 }
