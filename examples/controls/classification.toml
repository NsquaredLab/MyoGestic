# Map your model's outputs to VHI's controls.
#   left  = your name, anything you like
#   right = a control VHI declares (it owns the kind, range and states)
# See what a running VHI exports:  uv run --extra grpc python tools/inspect_canonical_control.py
# Full reference: docs/api/controls.md

[dofs]

# CLASSIFIER -> the same grouped mapping a regressor uses.
#
# `threshold` says this input is an activation, not a joint value: the classifier's
# probability is gated to exactly 0 or 1 here, then fanned out and weighted like any
# other control value. So VHI receives continuous per-control values — the same ones a
# regressor would send — and there is no separate "fist" state command.
#
# Drop `threshold` and the identical mapping serves a regressor emitting 0..1 directly.
fist = { targets = [
  { target = "vhi.prediction.thumb", weight = 0.6 },
  { target = "vhi.prediction.index" },
  { target = "vhi.prediction.middle" },
  { target = "vhi.prediction.ring" },
  { target = "vhi.prediction.little" },
], threshold = 0.5 }

# Same idea, one target: an activation gated to 0/1, not a joint value.
thumb_spread = { target = "vhi.prediction.thumb.abduction", threshold = 0.5 }
