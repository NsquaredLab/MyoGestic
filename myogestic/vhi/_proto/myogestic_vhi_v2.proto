syntax = "proto3";

package myogestic.vhi.v2;

// Canonical control plane between MyoGestic and the Virtual Hand Interface.
//
// v1 (myogestic_vhi.proto) is untouched and still served: it speaks in *movement
// names* and in a 9-float pose whose channel meaning lives nowhere. This service
// speaks the canonical control standard instead — an application declares what it
// controls by name ("index.flexion", "hand.grasp"), and VHI answers with what it
// can render. Neither side hard-codes a channel index.
//
// Three things v1 could not express, and the reason this file exists:
//
//   1. There was no handshake. A client sent nine floats and hoped. Channels 6-8
//      were dead on both ends for years without anything noticing, and four
//      hand-written tables in MyoGestic documented channel 1 wrongly.
//   2. Pose and movements were mutually exclusive (see v1 ControlMode), so an app
//      that wanted a continuous grip and a discrete grasp state needed two modes
//      it could not hold at once. v2 dissolves that rather than working around it:
//      continuous DOFs drive the predicted hand and discrete DOFs drive the control
//      hand's movements, so the two never contend for one driver.
//   3. Nothing could confirm a DOF actually renders the way its name claims.
//      Verifying that VHI curls the *index* finger, in the *flexion* direction,
//      required a human watching the screen. SweepControl closes that.
//
// Continuous time-series still belongs on LSL. This service carries the
// negotiation, discrete state, and verification.
service VhiCanonicalControl {
  // Negotiate a control space. The client declares every DOF it intends to
  // command; VHI answers per DOF, and names the LSL layout it will read
  // continuous values from. Call before streaming anything.
  rpc Declare (DeclareRequest) returns (DeclareReply);

  // Command one canonical frame. Intended for discrete DOFs and low-rate
  // continuous updates; a per-tick continuous stream belongs on LSL.
  rpc SetControl (SetControlRequest) returns (ControlAck);

  // Drive one DOF across its declared range and report what actually moved.
  // The verification primitive: it answers "does this name render as its name
  // claims, in the direction its name claims" without a human watching.
  rpc SweepControl (SweepControlRequest) returns (SweepControlReply);

  // Configure how the renderer *presents* transitions between commanded values.
  // Appearance only — see SetPresentationRequest.
  rpc SetPresentation (SetPresentationRequest) returns (ControlAck);

  // What can this target be told to do? Returns every control VHI exports, with the
  // semantics VHI itself declares for each. Call it before Declare.
  rpc GetControlManifest (GetControlManifestRequest) returns (ControlManifest);
}

// Empty — proto3 needs a message type even with no parameters.
message GetControlManifestRequest {}

// One control this target exports, addressed by a stable dotted name.
//
// The address is **owned by the target**. A client maps its own arbitrary
// model-output name onto one of these; it does not invent addresses and it does not
// hard-code their semantics. Everything a client needs in order to send values
// correctly is declared right here, by the side that renders them:
//
//   - whether it is a number or a held state, and
//   - for a number: its domain and its neutral value, and
//   - for a state: the states it accepts and which one is neutral.
//
// That is the whole point of shipping a manifest rather than a naming convention. A
// convention has to be kept in sync by hand on both sides; a manifest is read.
message ControlCapability {
  // Stable dotted address, e.g. "vhi.prediction.index.flexion". Namespaced by target
  // so addresses from different targets cannot collide in one client configuration.
  string address = 1;

  // Whether this control takes a number or a held state.
  Kind kind = 2;

  // CONTINUOUS only: the domain and the value meaning "no command".
  float lo = 3;
  float hi = 4;
  float rest = 5;

  // DISCRETE only: the states this control accepts, and the neutral one.
  repeated string states = 6;
  string rest_state = 7;

  // How a value on this control must be encoded when it travels over LSL rather than
  // over SetControl. Per-capability because the two inlets do not share a convention.
  ContinuousEncoding encoding = 8;

  // Human-readable: what moves, and any target-local behaviour worth knowing. For a
  // log or a UI — clients must not parse it.
  string description = 9;

  // The LSL stream this control is read from, when it is streamed rather than sent
  // over SetControl. Empty means SetControl only.
  string stream_name = 10;

  // Which channel of stream_name carries this control. -1 when it is not streamed.
  //
  // This is the address-to-channel map, published per capability rather than inferred
  // from a list, because two addresses may legitimately name the same channel: a short
  // form and its explicit axis form are the same control. A client resolves its own
  // alias to an address and the address to a channel, and never has to guess an index.
  int32 channel = 11;
}

message ControlManifest {
  // Which target this is, for a client that talks to more than one.
  string target_name = 1;

  // The vocabulary's own version. Bumped when addresses are added or their declared
  // semantics change, so a client can notice rather than silently mis-send.
  string vocabulary_version = 2;

  // Every control this build exports. A client validates its configuration against
  // this list and reports an unknown address by name — with these as the alternatives.
  repeated ControlCapability capabilities = 3;
}

// How the renderer blends between the values it is given.
//
// This is the third and last of three distinct layers, and confusing them is the
// mistake it exists to prevent:
//
//   1. Continuous smoothing, on the MyoGestic side, inside ControlBus and before any
//      target sees a frame. Authoritative: it decides what value is *commanded*.
//   2. Discrete debounce and hysteresis, also MyoGestic-side, declared on the DOF. A
//      classifier's state must be gated for stability before it becomes a
//      transition. A discrete control is never numerically low-pass filtered as
//      though it were an axis — that would interpolate through states nobody
//      selected.
//   3. This: purely visual interpolation in the renderer, so a hand does not snap
//      jarringly between poses.
//
// Layer 3 must never be relied on as protection against classifier chatter. It
// changes only how a commanded value *looks* on its way to being reached; it does not
// change the value, and it cannot make an unstable prediction stable. A build with
// blending on and no debounce still jumps between states — it just does so smoothly.
message SetPresentationRequest {
  // Interpolate toward each newly commanded pose instead of snapping to it.
  bool blend = 1;
  // Interpolation speed when blend is true; higher is snappier. Non-positive leaves
  // the renderer's current speed alone.
  float blend_speed = 2;
}

// What a canonical DOF is. Mirrors the standard rather than VHI's rig: a
// continuous DOF is signed and normalized, +1 meaning the direction the name
// denotes, and rest is expressible inside the declared range.
enum Kind {
  KIND_UNSPECIFIED = 0;
  // A number in [lo, hi]. Signed and normalized; rest is usually 0.
  CONTINUOUS = 1;
  // Exactly one of a fixed set of states. A held state, not an event.
  DISCRETE = 2;
}

// One DOF the client intends to command.
message DofDeclaration {
  // The client's own name for this output — an alias it owns, e.g. "my_index" or
  // "fist". Echoed back in the verdict so a client can match answers to its own
  // configuration. VHI does not interpret it and must never require a shape for it.
  string name = 1;
  Kind kind = 2;
  // CONTINUOUS only. Defaults to [-1, 1] when both are zero.
  float lo = 3;
  float hi = 4;
  // CONTINUOUS only: the value meaning "no command". Must lie in [lo, hi].
  float rest = 5;
  // DISCRETE only: at least two unique state names.
  repeated string states = 6;
  // DISCRETE only: the neutral state; must appear in states.
  string rest_state = 7;

  // The target-owned control address this alias maps to, from GetControlManifest —
  // e.g. "vhi.prediction.index". This is what VHI resolves; `name` is the client's
  // label for it.
  //
  // When empty, VHI falls back to treating `name` as the address, which is what a
  // client written before the manifest existed sends. That fallback is why this field
  // is additive rather than breaking.
  string address = 8;

  // For a grouped mapping: the gain this alias applies to THIS address before VHI's own
  // range conversion. Defaults to 1.0 when zero-or-unset, so a client that sends no
  // weight is unchanged. One alias fanning out to several addresses sends one
  // declaration per address, each with its own weight.
  float weight = 9;
}

message DeclareRequest {
  // The standard vocabulary version the client was written against. VHI records
  // it and reports its own; deciding what a mismatch means is this handshake's
  // job, not the loader's.
  string standard_version = 1;
  repeated DofDeclaration dofs = 2;
  // Optional client identifier for VHI's log — an app name, not an identity.
  string client_name = 3;

  // Opt in to driving the *control* hand from a streamed pose, and say which
  // convention you will send on MyoGestic_ControlPose.
  //
  // ENCODING_UNSPECIFIED (the default, and what every existing client sends by
  // omission) means "I am not declaring that stream": VHI leaves the control hand
  // and that inlet exactly as they were, decoding renderer units. That is what keeps
  // this additive — a producer written before this field keeps working unchanged.
  //
  // CANONICAL asks VHI to read the stream as canonical values (+1 is the direction
  // the channel's name denotes) and to put the control hand into Stream mode so the
  // inlet is actually consumed. LEGACY_NEGATED asks for the same mode switch while
  // keeping renderer units, which is the migration path for an existing producer that
  // wants the handshake without changing its numbers yet.
  //
  // Declaring this alongside a discrete DOF is refused: a discrete DOF renders as a
  // control-hand *movement*, and a streamed pose drives the same bones. Two drivers
  // for one hand is what v1's ControlMode existed to arbitrate, and refusing the
  // combination up front is better than arbitrating it per command.
  ContinuousEncoding control_pose_encoding = 4;
}

// What VHI can do with one declared DOF.
message DofVerdict {
  // The client's alias, echoed verbatim.
  string name = 1;
  // The address it resolved to, so a client can see what VHI actually matched.
  string address = 5;
  // true: VHI will render this DOF. false: it will not, and says why. A DOF that
  // is declared but not renderable must never be silently ignored — an ignored
  // joint looks exactly like a joint that is working and holding still.
  bool renderable = 2;
  // Human-readable reason when renderable == false.
  string message = 3;
  // The rig element this DOF drives, for the record (e.g. "thumb bones 1-3, X
  // axis"). Informational: clients must not parse it.
  string renders_as = 4;
}

// How values on the negotiated continuous stream are to be interpreted.
//
// This exists because the first end-to-end run of v2 got it wrong: the handshake
// agreed on channel *names* while VHI's LSL consumer still decoded legacy units, so
// a canonical +1 arrived as legacy +1 and the hand extended when it should have
// flexed. Nothing on the wire said which convention was in force. A negotiation that
// settles identity but leaves units implicit is not a negotiation.
enum ContinuousEncoding {
  // The server did not say. A client MUST NOT guess — treat it as "cannot
  // negotiate" and fall back, because guessing wrong inverts every joint.
  ENCODING_UNSPECIFIED = 0;
  // Canonical: the value means what the standard says, +1 being the direction the
  // DOF name denotes. No transformation.
  CANONICAL = 1;
  // The legacy convention: the renderer multiplies by a negative per-bone gain, so
  // a canonical value must be negated before it goes on the wire. Reported while
  // VHI's continuous path is still the pre-v2 decoder.
  LEGACY_NEGATED = 2;
}

message DeclareReply {
  // true only if every declared DOF is renderable.
  bool accepted = 1;
  repeated DofVerdict verdicts = 2;
  // VHI's own standard version.
  string standard_version = 3;
  // How to encode values on continuous_stream_name. Not optional in practice: an
  // ENCODING_UNSPECIFIED reply must be treated as a failed negotiation.
  ContinuousEncoding continuous_encoding = 6;
  // The LSL stream VHI will read continuous values from, and the channel order
  // it expects on it. Order is authoritative: index i of this list is channel i,
  // and a client is expected to build its frame *from* this list rather than from
  // its own configuration — which is what makes the two unable to disagree.
  //
  // Publishing these as LSL channel labels is good practice, but note that VHI does
  // not read them back today: since the frame layout is derived from this reply, a
  // label check could not fail. It becomes worth adding if a client ever lays out
  // its frame independently of the negotiation.
  string continuous_stream_name = 4;
  repeated string continuous_channel_order = 5;
  // Whether the renderer currently blends between commanded values (layer 3, see
  // SetPresentationRequest). Reported so a client can *see* that visual smoothing is
  // on — never so it can treat that as a substitute for its own debounce.
  bool blends_presentation = 7;

  // The control-hand pose stream, populated only when the request declared a
  // control_pose_encoding. Same contract as the continuous fields above: the order is
  // authoritative, and the encoding is what VHI will actually apply — which may differ
  // from what was asked for if VHI could not honour it, so read it rather than
  // assuming the request was accepted.
  string control_pose_stream_name = 8;
  repeated string control_pose_channel_order = 9;
  ContinuousEncoding control_pose_encoding = 10;
}

message SetControlRequest {
  // Continuous DOF values by canonical name. Each must be finite and inside the
  // range declared for it.
  map<string, float> continuous = 1;
  // Discrete DOF states by canonical name. Each must be one of that DOF's
  // declared states. Kept separate from continuous on purpose: a held state and
  // a number are not the same kind of command.
  //
  // A state is resolved against the renderer's own vocabulary — for VHI, the
  // movement names it currently offers, matched case-insensitively. Declare reports
  // the resolution up front (see DofVerdict.renders_as) so a client never has to
  // guess whether "fist" means anything here.
  map<string, string> discrete = 2;
}

message ControlAck {
  // true: every value in the request was applied.
  bool applied = 1;
  // Names that were rejected, with the reason. Empty when applied == true.
  map<string, string> rejected = 2;
}

message SweepControlRequest {
  // The DOF to exercise. Must have been declared and found renderable.
  string name = 1;
  // Seconds for the whole sweep. VHI clamps to something it can animate.
  float duration_s = 2;
  // true: rest -> hi -> rest -> lo -> rest, so both directions are observed.
  // false: rest -> hi -> rest only.
  bool both_directions = 3;
}

// What VHI measured on its own rig while sweeping. Read back from the skeleton
// after rendering, not echoed from the request — otherwise it would confirm only
// that VHI can repeat a number back.
message SweepObservation {
  // The rig element that moved, e.g. "index bone 4".
  string element = 1;
  // Signed rotation extreme in degrees observed while the DOF was at hi. Its
  // sign is the whole point: it says which way the joint actually went.
  float degrees_at_hi = 2;
  // Same at lo. Zero when both_directions was false.
  float degrees_at_lo = 3;
}

message SweepControlReply {
  bool completed = 1;
  // Reason when completed == false.
  string message = 2;
  // Every rig element that moved by more than a negligible amount during the
  // sweep. A correctly named DOF moves exactly the elements its name denotes; a
  // list with anything extra is a rigging or mapping error, and an empty list
  // means the DOF was accepted but renders nothing.
  repeated SweepObservation observed = 3;
  // Convenience: true when the sweep moved the elements VHI itself associates
  // with this DOF name, and nothing else. Clients should still inspect
  // `observed` rather than trusting a single bool.
  bool matched_expectation = 4;
}

// ---------------------------------------------------------------------------
// Recording / label-acquisition aid.
//
// Deliberately a SEPARATE service, not extra RPCs on VhiCanonicalControl, because
// the distinction is the whole point: this is not a control plane and nothing here
// is a canonical DOF.
//
// A canonical discrete DOF is a *held state* — an application asks for "grip" and
// the hand holds a grip. That semantics must not bend to accommodate data
// collection. But collecting regression training data needs the opposite: a
// deliberately moving control hand, so the recorded VHI_Control stream sweeps a
// continuous kinematic range for EMG windows to be aligned against.
//
// Both live here because both are properties of a *recording session* rather than of
// the thing being controlled:
//
//   - the session gate, which stops VHI's local keyboard from competing with
//     MyoGestic as a movement source while a session is being recorded;
//   - the training program, which cycles the control hand to generate a trajectory.
//
// A program names a VHI movement, and that is intentional: a recording aid is
// allowed to be application-specific, precisely so the canonical vocabulary does not
// have to grow a concept ("sweep me for training") that no application controls.
// ---------------------------------------------------------------------------
service VhiTrainingAid {
  // Mark a MyoGestic recording session active or finished. While active, VHI ignores
  // its local keyboard so the recording has a single movement source.
  rpc SetRecordingSession (SetRecordingSessionRequest) returns (TrainingAck);

  // Start cycling the control hand through a movement, producing a continuous
  // trajectory on VHI_Control. Refused if a program is already running.
  rpc StartTrainingProgram (StartTrainingProgramRequest) returns (TrainingAck);

  // Stop the program and return the control hand to rest.
  rpc StopTrainingProgram (StopTrainingProgramRequest) returns (TrainingAck);

  // Query the aid's state. Also carries the movement names a program may use, so a
  // client can discover them without the v1 control service.
  rpc GetTrainingState (GetTrainingStateRequest) returns (TrainingState);
}

message SetRecordingSessionRequest {
  // true while a recording session is in progress.
  bool active = 1;
}

message StartTrainingProgramRequest {
  // A VHI movement name, from TrainingState.available_movements. Application-specific
  // by design — see the note above this service.
  string movement = 1;
  // Movement cycles per second. Non-positive leaves VHI's current timing alone.
  float frequency_hz = 2;
  // Seconds held at full excursion in each cycle. Negative leaves it alone.
  float hold_time_s = 3;
  // Seconds held at rest in each cycle. Negative leaves it alone.
  float rest_time_s = 4;
}

// Empty — proto3 needs a message type even with no parameters.
message StopTrainingProgramRequest {}
message GetTrainingStateRequest {}

message TrainingAck {
  bool applied = 1;
  // Human-readable reason when applied == false.
  string message = 2;
}

message TrainingState {
  // Whether a recording session is currently marked active.
  bool recording_session_active = 1;
  // Whether a training program is cycling the control hand right now.
  bool program_running = 2;
  // The movement a running program is cycling; empty when none is running.
  string program_movement = 3;
  // The control hand's animation state, e.g. "waiting" | "closing" | "holding".
  string animation_state = 4;
  // Movement names a program may name. Discover, don't hard-code.
  repeated string available_movements = 5;
  // The control hand's currently selected movement, whatever selected it. Lets a UI
  // highlight it without the v1 control service.
  string current_movement = 6;
}
