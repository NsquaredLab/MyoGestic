; MyoGestic's fallback liblsl config, used only when nothing else configures liblsl.
;
; It sets one thing: console verbosity. Nothing here touches discovery, ports or which
; interfaces are bound — those stay at liblsl's defaults, because a library must not quietly
; change a user's networking.
;
; At the default level every outlet logs a line per network interface, and MyoGestic publishes
; one outlet per control it drives. -2 keeps errors.
;
; Comments are `;`. liblsl's parser does not take `#`.

[log]
level = -2
